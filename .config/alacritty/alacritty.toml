[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml"
]

# ~/.config/alacritty/alacritty.toml

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.offset]
y = 3 # Adjust line height / vertical spacing

[cursor]
blink_interval = 500
blink_timeout = 10

[cursor.style]
blinking = "On"

[window]
decorations = "Buttonless" # Use "None" for Linux/Windows
# opacity = 0.7

[bell]
duration = 0
